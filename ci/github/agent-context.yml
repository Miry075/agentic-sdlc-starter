# Copy to .github/workflows/agent-context.yml
name: Agent context checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  agent-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: AGENTS.md is updated when the structure changes
        env:
          SKIP_AGENTS_MD_CHECK: ${{ contains(github.event.pull_request.labels.*.name, 'skip-agents-md') }}
        run: bash scripts/check-agents-md-freshness.sh "origin/${{ github.base_ref }}"

      - name: ADRs and specs follow their template
        run: bash scripts/check-docs-templates.sh .

      - name: No broken links in agent docs
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress "AGENTS.md" "**/AGENTS.md" "docs/**/*.md"
          fail: true
